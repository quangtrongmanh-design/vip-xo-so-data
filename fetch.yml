name: Update lottery data
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Ngày cần lấy YYYY-MM-DD (để trống = hôm nay Việt Nam)'
        required: false
        type: string
  schedule:
    - cron: '50 11 * * *' # 18:50 giờ Việt Nam
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Fetch result
        run: |
          node scripts/fetch.js 2026-10-17
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update lottery data"
          git push
